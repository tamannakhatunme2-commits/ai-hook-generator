<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HookAI - Professional SaaS Dashboard</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #0B0F19; color: #F3F4F6; font-family: 'Inter', sans-serif; }
        .premium-gradient { background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <div class="w-64 bg-[#111827] border-r border-gray-800 p-6 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="flex items-center gap-3 mb-10">
                <div class="p-2 premium-gradient rounded-lg text-white"><i class="fa-solid fa-bolt text-xl"></i></div>
                <span class="text-xl font-bold tracking-wider text-white">HookAI</span>
            </div>
            <nav class="space-y-4">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-gray-800 text-white rounded-lg font-medium"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="fa-solid fa-bookmark"></i> Saved Hooks</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
        </div>
        <div class="flex items-center gap-3 border-t border-gray-800 pt-4">
            <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center text-white font-bold">U</div>
            <div>
                <p class="text-sm font-semibold text-white">Premium User</p>
                <p class="text-xs text-gray-500">Active Plan</p>
            </div>
        </div>
    </div>

    <!-- MAIN APP AREA -->
    <div class="flex-1 flex flex-col overflow-y-auto bg-[#0B0F19] p-6 md:p-10">
        <div class="max-w-4xl mx-auto w-full space-y-8">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">AI Hook Generator</h1>
                <p class="text-gray-400 mt-2 text-sm">Create high-converting, viral hooks for LinkedIn & Twitter (X) in milliseconds.</p>
            </div>

            <!-- INPUT BOXES -->
            <div class="bg-[#111827] border border-gray-800 rounded-xl p-6 space-y-6 shadow-xl">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">What is your post about?</label>
                    <textarea id="topicInput" rows="3" class="w-full bg-[#1F2937] border border-gray-700 rounded-lg p-4 text-white focus:outline-none focus:border-blue-500 placeholder-gray-500 text-sm transition" placeholder="e.g., How I built a profitable SaaS business in just 2 weeks using AI tools..."></textarea>
                </div>
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Select Audience Tone</label>
                        <select id="toneSelect" class="w-full bg-[#1F2937] border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 text-sm transition">
                            <option value="viral">🔥 Viral Growth (High Curiosity)</option>
                            <option value="professional">💼 Thought Leadership (LinkedIn Style)</option>
                            <option value="casual">💬 Storytelling & Casual</option>
                        </select>
                    </div>
                    <div class="flex items-end w-full sm:w-auto">
                        <button onclick="generateHooks()" class="w-full sm:w-auto px-8 py-3.5 premium-gradient text-white font-bold rounded-lg hover:opacity-90 shadow-lg shadow-purple-500/20 text-sm tracking-wide transition flex items-center justify-center gap-2">
                            <span id="btnText">Generate Hooks</span>
                            <i id="btnIcon" class="fa-solid fa-wand-magic-sparkles"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- OUTPUT HOOKS -->
            <div id="outputSection" class="space-y-4 hidden">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-400">Your AI-Generated Hooks</h3>
                <div id="hooksGrid" class="grid gap-4">
                    <!-- Hooks here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        function generateHooks() {
            const topic = document.getElementById('topicInput').value.trim();
            const tone = document.getElementById('toneSelect').value;
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const outputSection = document.getElementById('outputSection');
            const hooksGrid = document.getElementById('hooksGrid');

            if (!topic) {
                alert('Please enter a topic first!');
                return;
            }

            btnText.innerText = 'Analyzing & Generating...';
            btnIcon.className = 'fa-solid fa-spinner animate-spin';
            outputSection.classList.add('hidden');

            setTimeout(() => {
                let hooks = [];
                if (tone === 'viral') {
                    hooks = [
                        `🚨 I built a SaaS in 14 days with \$0 credit. Most people told me it was impossible on a phone. Here is the exact framework I used (that you can copy today):`,
                        `🧵 The \$0 SaaS Playbook: How to launch an international software product in 2 weeks without writing a single line of code. (Step-by-step breakdown below)`,
                        `Most founders fail because they spend months coding. I spent 2 days building and 12 days preparing to sell. Here is the framework changing everything 👇`
                    ];
                } else if (tone === 'professional') {
                    hooks = [
                        `Efficiency beats perfection in modern software development. Here is how leveraging cloud automation allowed a full product launch within a 2-week strict deadline:`,
                        `An analytical approach to Micro-SaaS asset evaluation: Why institutional buyers prioritize problem-solving core architecture over complex features.`,
                        `Strategic asset development: A case study on building and positioning a production-ready software product for a rapid market exit.`
                    ];
                } else {
                    hooks = [
                        `Honestly, I was terrified to build a software product on my phone. But 2 weeks later, it's completely ready. Here’s the story of how it happened...`,
                        `Quick heads-up if you're trying to build a business: Stop overcomplicating your tech stack. Here's a super simple way to build something people want.`,
                        `Just finished building this tool and it feels amazing. No massive servers, just a simple solution to a real problem. Here is what I learned along the way:`
                    ];
                }

                hooksGrid.innerHTML = '';
                hooks.forEach((hook, index) => {
                    hooksGrid.innerHTML += `
                        <div class="bg-[#111827] border border-gray-800 rounded-xl p-5 flex flex-col justify-between gap-4 shadow-md hover:border-gray-700 transition">
                            <p class="text-gray-200 text-sm leading-relaxed">${hook}</p>
                            <div class="flex justify-between items-center border-t border-gray-800 pt-3">
                                <span class="text-xs text-gray-500 font-medium">Option ${index + 1}</span>
                                <button onclick="copyToClipboard(this, \`${hook.replace(/"/g, '&quot;')}\`)" class="text-xs bg-gray-800 text-gray-300 hover:text-white px-3 py-1.5 rounded border border-gray-700 font-semibold transition flex items-center gap-1.5">
                                    <i class="fa-regular fa-copy"></i> Copy
                                </button>
                            </div>
                        </div>
                    `;
                });

                btnText.innerText = 'Generate Hooks';
                btnIcon.className = 'fa-solid fa-wand-magic-sparkles';
                outputSection.classList.remove('hidden');
            }, 1200);
        }

        function copyToClipboard(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> Copied!';
                btn.classList.add('bg-green-950/30', 'border-green-800', 'text-green-400');
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('bg-green-950/30', 'border-green-800', 'text-green-400');
                }, 2000);
            });
        }
    </script>
</body>
</html>
